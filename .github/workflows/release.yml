name: Release

# Publishes to npm when a version tag is pushed. The tag has no `v` prefix,
# matching the version in package.json verbatim — the podspec reads its version
# from there, so the three can never disagree.
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Required reviewers on this environment: a pushed tag waits for a human to
    # approve the run before anything reaches npm.
    environment: npm-publish
    permissions:
      # Deliberately no `contents: write`: this job runs `npm ci`, which
      # executes dependency lifecycle code, and a token that can rewrite the
      # repository has no business being reachable from there. The GitHub
      # release is created by the job below instead.
      contents: read
      id-token: write # trusted publishing — no NPM_TOKEN, and npm attaches provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          # No `registry-url`: it makes setup-node write an .npmrc with
          # `_authToken=${NODE_AUTH_TOKEN}`, and with trusted publishing there is
          # no such token. npm then authenticates with an empty one and the
          # registry answers 404 — its response for "not authorised" — instead of
          # falling back to OIDC.

      # Trusted publishing needs npm 11.5.1+; the runner ships npm 11.x. Pinned
      # rather than `@latest`: this runs in the job that holds the OIDC token.
      # npm 12 needs Node ^24.15.0, which `node-version: 26` above satisfies.
      - run: npm install -g npm@12.0.2 && npm --version

      # A version can never be republished, so refuse a tag that disagrees with
      # package.json rather than burning the number.
      - name: Check the tag matches package.json
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # Also before publishing: a missing changelog entry should stop the
      # release while the number is still free.
      - name: Check the changelog has an entry
        run: node internal/module_scripts/changelog-notes.js "$GITHUB_REF_NAME" > /dev/null

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck

      # `prepare` rebuilds `build/` and `plugin/build/` from scratch as part of
      # publishing.
      - run: npm publish

  release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Separate job so the write-capable token is never present while
      # dependency code runs. Nothing is installed here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node internal/module_scripts/changelog-notes.js "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
