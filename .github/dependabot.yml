version: 2

# The release pipeline runs dependency code, so an unnoticed vulnerable
# dependency is the realistic way this package ships something it should not.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # The Expo SDK decides these, not the registry: `npx expo install --check`
      # knows the version each one is supposed to be at, and CI runs it. What
      # Dependabot proposes for them is the latest release, which is a different
      # question and often the wrong answer — it offered react-native 0.87 where
      # SDK 57 wants 0.86.3, and TypeScript 7 where it wants ~6.0.3.
      #
      # When the check goes red, `npx expo install --fix` moves the whole set
      # together, which is the only way it stays consistent.
      - dependency-name: expo
      - dependency-name: expo-modules-core
      - dependency-name: react-native
      - dependency-name: react
      - dependency-name: jest-expo
      - dependency-name: babel-preset-expo
      - dependency-name: typescript
      - dependency-name: '@types/react'
      # Not in the SDK's list, but pinned to it in practice: Babel 8 fails
      # @react-native/jest-preset's `assertVersion("^7.0.0-0")`, and Jest 30
      # fails inside jest-expo with `clearMocksOnScope is not a function`.
      # Patches still come through.
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
      - dependency-name: jest
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']
      # ESLint 10 removed the old rule context API, and eslint-plugin-react has
      # not shipped a release that stops using it — 7.37.5, its latest, still
      # declares `eslint: ^3 || … || ^9.7`. eslint-config-universe depends on
      # that plugin, so the whole config fails to load: "Error while loading
      # rule 'react/no-did-mount-set-state': contextOrFilename.getFilename is
      # not a function". Lift this once the plugin supports 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /example
    schedule:
      interval: weekly
    groups:
      example:
        patterns: ['*']
    ignore:
      # Same as above: the example app tracks the SDK, not the registry.
      - dependency-name: expo
      - dependency-name: react-native
      - dependency-name: react

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website:
        patterns: ['*']

  # Keeps the SHA pins in the workflows current — pinning and updating are not
  # in conflict; the pin is what makes the update reviewable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
