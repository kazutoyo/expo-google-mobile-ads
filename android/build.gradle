plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.googlemobileads'
version = '0.2.0'

// ExpoGoogleMobileAdsModule is an Expo Modules API 2.0 module; the ad objects and the view stay
// on 1.0 in ExpoGoogleMobileAdsObjectsModule.
expoModule {
  v2 true
}

android {
  namespace "expo.modules.googlemobileads"
  defaultConfig {
    versionCode 2
    versionName "0.2.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.6.0"
}
